<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paragraph that uses both <strong> and <em></title>
  </head>
  <body>
    <p>
      Reading books is <strong>extremely rewarding</strong> as it expands
      knowledge and <em>stimulates the imagination</em>.
    </p>
  </body>
</html>
