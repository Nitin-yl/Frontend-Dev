<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Using multiple tags</title>
  </head>
  <body>
    <p>
      My favorite hobby is <strong>playing video games</strong>, which I find
      <em>extremely exciting</em>.<br />
      Sometimes, I spend hours on <mark>strategy games</mark> to improve my
      skills.<br />
      <small>Updated recently</small>
    </p>
  </body>
</html>
