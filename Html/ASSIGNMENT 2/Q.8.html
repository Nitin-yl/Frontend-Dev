<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Use mark and small tag</title>
  </head>
  <body>
    <p>
      My favorite hobby is <mark>playing video games</mark> because it is both
      fun and challenging.
      <small>Updated recently</small>
    </p>
  </body>
</html>
