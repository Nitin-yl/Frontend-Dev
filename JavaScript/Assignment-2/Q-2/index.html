<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>String Manipulation Report</title>
    <style>
      body {
        font-family: "Poppins", sans-serif;
        background: #f2f5f9;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      .container {
        background: #fff;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        text-align: center;
        width: 350px;
      }

      h1 {
        color: #333;
        font-size: 20px;
        margin-bottom: 20px;
      }

      button {
        background: #4caf50;
        border: none;
        color: white;
        padding: 10px 15px;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.3s;
      }

      button:hover {
        background: #388e3c;
      }

      #output {
        margin-top: 20px;
        font-size: 17px;
        color: #333;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>String Manipulation Report</h1>
      <button onclick="formatTitle()">Format Product Name</button>
      <div id="output"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
