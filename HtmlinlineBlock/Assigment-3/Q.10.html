<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dropdown-based Selection Page:</title>
  </head>
  <body>
    <form>
      <label for="country">Country:</label>
      <select id="country" name="country">
        <option value="india" selected>India</option>
        <option value="usa">USA</option>
        <option value="france">France</option>
        <option value="japan">Japan</option>
      </select>
      <br /><br />

      <label for="state">State:</label>
      <select id="state" name="state">
        <option value="maharashtra" selected>Maharashtra</option>
        <option value="texas">Texas</option>
        <option value="ile-de-france">Île-de-France</option>
        <option value="tokyo">Tokyo</option>
      </select>
      <br /><br />

      <label for="city">City:</label>
      <select id="city" name="city">
        <option value="mumbai" selected>Mumbai</option>
        <option value="austin">Austin</option>
        <option value="paris">Paris</option>
        <option value="shibuya">Shibuya</option>
      </select>
      <br /><br />

      <label for="tourist">Favorite Tourist Place:</label>
      <select id="tourist" name="tourist">
        <option value="gateway" selected>Gateway of India</option>
        <option value="statue">Statue of Liberty</option>
        <option value="eiffel">Eiffel Tower</option>
        <option value="shibuya_crossing">Shibuya Crossing</option>
      </select>
    </form>

    <p>
      You have selected: India, Maharashtra, Mumbai, and Gateway of India as
      your favorite tourist place.
    </p>
  </body>
</html>
