<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Report Page:</title>
</head>
<body>
    <h1>MD Public School</h1>

    <table border="1" cellpadding="5" cellspacing="0">
        <thead>
            <tr>
                <th rowspan="2">Subject</th>
                <th colspan="2">Marks</th>
            </tr>
            <tr>
                <th>Max</th>
                <th>Obtained</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Mathematics</td>
                <td>100</td>
                <td>88</td>
            </tr>
            <tr>
                <td>English</td>
                <td>100</td>
                <td>92</td>
            </tr>
            <tr>
                <td>Science</td>
                <td>100</td>
                <td>85</td>
            </tr>
            <tr>
                <td>History</td>
                <td>100</td>
                <td>90</td>
            </tr>
            <tr>
                <td>Computer</td>
                <td>100</td>
                <td>95</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td colspan="2">Total</td>
                <td>450/500</td>
            </tr>
            <tr>
                <td colspan="2">Percentage</td>
                <td>90%</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
